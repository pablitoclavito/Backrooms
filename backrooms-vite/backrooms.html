const CHUNK_SIZE = 40;
const WALL_HEIGHT = 3;
const FADE_DURATION = 1; // seconds
const UNLOAD_DISTANCE = 90; // distance threshold for wall unload

const GRID_STEP = CHUNK_SIZE / 8; // same as used in generateChunk
const wallGrid = new Map(); // or use a 2D array if world size is fixed

const activeChunks = new Map();

createStartRoom();

function createWall(x, z, length, height, isVertical, chunkKey) {
  const thickness = 0.3;
  let width = isVertical ? thickness : length;
  let depth = isVertical ? length : thickness;

  const geo = new THREE.BoxGeometry(width, height, depth);
  const tex = wallTex.clone();
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(length / 2, height / 2);

  const mat = new THREE.MeshLambertMaterial({
    map: tex,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, height / 2, z);
  mesh.userData = {
    createdAt: performance.now() / 1000,
    fadingOut: false,
    chunkKey
  };

  // Create bounding box for collision
  mesh.userData.box = new THREE.Box3().setFromObject(mesh);

  scene.add(mesh);
  if (!activeChunks.has(chunkKey)) activeChunks.set(chunkKey, []);
  activeChunks.get(chunkKey).push(mesh);

  const halfX = width / 2;
  const halfZ = depth / 2;
  
  // Sample points across the wall's area and mark them blocked
  for (let dx = -halfX; dx <= halfX; dx += GRID_STEP / 2) {
    for (let dz = -halfZ; dz <= halfZ; dz += GRID_STEP / 2) {
      const gx = Math.floor((x + dx) / GRID_STEP);
      const gz = Math.floor((z + dz) / GRID_STEP);
      wallGrid.set(`${gx},${gz}`, true); // true = wall
    }
  }

}

function worldToGrid(pos) {
  return {
    x: Math.floor(pos.x / GRID_STEP),
    z: Math.floor(pos.z / GRID_STEP)
  };
}

function gridToWorld(gx, gz) {
  return {
    x: gx * GRID_STEP + GRID_STEP / 2,
    z: gz * GRID_STEP + GRID_STEP / 2
  };
}

function isWalkable(gx, gz) {
  return !wallGrid.has(`${gx},${gz}`);
}

function generateChunk(cx, cz) {
  const key = `${cx},${cz}`;
  if (key === "start-room") return; // Avoid overwriting the start room
  if (activeChunks.has(key)) return;

  const centerX = cx * CHUNK_SIZE;
  const centerZ = cz * CHUNK_SIZE;
  const step = CHUNK_SIZE / 8;

    for (let dx = -CHUNK_SIZE / 2; dx <= CHUNK_SIZE / 2; dx += step) {
      for (let dz = -CHUNK_SIZE / 2; dz <= CHUNK_SIZE / 2; dz += step) {
        if (Math.random() < 0.95) {
          const length = step;
          const isVertical = Math.random() < 0.5;
          createWall(centerX + dx, centerZ + dz, length, WALL_HEIGHT, isVertical, key);
        }
      }
    }
}

function manageChunks() {
  const cx = Math.floor(camera.position.x / CHUNK_SIZE);
  const cz = Math.floor(camera.position.z / CHUNK_SIZE);

  for (let dx = -1; dx <= 1; dx++) {
  for (let dz = -1; dz <= 1; dz++) {
    generateChunk(cx + dx, cz + dz);
  }
}

  const now = performance.now() / 1000;
  for (const [key, meshes] of activeChunks) {
    const [chunkX, chunkZ] = key.split(',').map(Number);
    const dx = chunkX * CHUNK_SIZE - camera.position.x;
    const dz = chunkZ * CHUNK_SIZE - camera.position.z;
    const distSq = dx * dx + dz * dz;

    if (distSq > UNLOAD_DISTANCE * UNLOAD_DISTANCE) {
      for (const mesh of meshes) {
        if (!mesh.userData.fadingOut) {
          mesh.userData.fadingOut = true;
          mesh.userData.fadeStart = now;
        }
      }
    } else {
      for (const mesh of meshes) {
        if (mesh.userData.fadingOut) {
          mesh.userData.fadingOut = false;
          mesh.userData.createdAt = now;
        }
      }
    }
  }

  for (const [key, meshes] of activeChunks) {
    for (let i = meshes.length - 1; i >= 0; i--) {
      const mesh = meshes[i];
      const t = now - (mesh.userData.fadingOut ? mesh.userData.fadeStart : mesh.userData.createdAt);
      const alpha = mesh.userData.fadingOut
        ? 1 - Math.min(t / FADE_DURATION, 1)
        : Math.min(t / FADE_DURATION, 1);

      mesh.material.opacity = alpha;

      if (mesh.userData.fadingOut && alpha <= 0) {
        scene.remove(mesh);
        meshes.splice(i, 1);
      } else {
        // Update bounding box if still visible
        mesh.userData.box.setFromObject(mesh);
      }
    }

    if (meshes.length === 0) activeChunks.delete(key);
  }
}

// Collision detection: checks if camera collides with any fully visible wall
function checkCollision(pos) {
  const r = 0.3; // collision radius
  // Approximate camera bounding box (around feet level)
  const box = new THREE.Box3(
    new THREE.Vector3(pos.x - r, pos.y - 1.6, pos.z - r),
    new THREE.Vector3(pos.x + r, pos.y - 1.0, pos.z + r)
  );

  for (const meshes of activeChunks.values()) {
    for (const mesh of meshes) {
      if (!mesh.userData.fadingOut && mesh.userData.box.intersectsBox(box)) {
        return true;
      }
    }
  }
  return false;
}

function createCeilingTexture() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#fefae0';
  ctx.fillRect(0, 0, size, size);

  for (let i = 0; i < 3000; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const alpha = Math.random() * 0.2;
    const gray = 200 + Math.random() * 55;
    ctx.fillStyle = `rgba(${gray}, ${gray}, ${gray}, ${alpha})`;
    ctx.fillRect(x, y, 1, 1);
  }

  ctx.strokeStyle = '#aaa';
  ctx.lineWidth = 2;
  const tileSize = size / 4;
  for (let i = 0; i <= size; i += tileSize) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(10, 10);
  return texture;
}

function findSafeStartPosition() {
  const baseY = 1.6;
  const maxAttempts = 100;
  const radius = 4.0; // how far from the original position to search

  for (let i = 0; i < maxAttempts; i++) {
    const x = (Math.random() * 2 - 1) * radius;
    const z = (Math.random() * 2 - 1) * radius;
    const testPos = new THREE.Vector3(x, baseY, z);

    if (!checkCollision(testPos)) {
      camera.position.copy(testPos);
      console.log(`Found safe start at (${x.toFixed(2)}, ${z.toFixed(2)})`);
      return;
    }
  }

  console.warn("Could not find a safe starting position after 100 attempts.");
}

function findPathAStar(start, goal) {
  const openSet = [start];
  const cameFrom = new Map();

  const gScore = new Map();
  const fScore = new Map();

  const key = (x, z) => `${x},${z}`;
  gScore.set(key(start.x, start.z), 0);
  fScore.set(key(start.x, start.z), heuristic(start, goal));

  while (openSet.length > 0) {
    // Get node with lowest fScore
    openSet.sort((a, b) => fScore.get(key(a.x, a.z)) - fScore.get(key(b.x, b.z)));
    const current = openSet.shift();
    const currKey = key(current.x, current.z);

    if (current.x === goal.x && current.z === goal.z) {
      return reconstructPath(cameFrom, current);
    }

    for (const dir of [
      { x: 1, z: 0 },
      { x: -1, z: 0 },
      { x: 0, z: 1 },
      { x: 0, z: -1 }
    ]) {
      const neighbor = { x: current.x + dir.x, z: current.z + dir.z };
      const neighborKey = key(neighbor.x, neighbor.z);

      if (!isWalkable(neighbor.x, neighbor.z)) continue;

      const tentativeG = (gScore.get(currKey) ?? Infinity) + 1;

      if (tentativeG < (gScore.get(neighborKey) ?? Infinity)) {
        cameFrom.set(neighborKey, current);
        gScore.set(neighborKey, tentativeG);
        fScore.set(neighborKey, tentativeG + heuristic(neighbor, goal));

        if (!openSet.some(n => n.x === neighbor.x && n.z === neighbor.z)) {
          openSet.push(neighbor);
        }
      }
    }
  }

  return []; // No path
}

function heuristic(a, b) {
  return Math.abs(a.x - b.x) + Math.abs(a.z - b.z); // Manhattan distance
}

function reconstructPath(cameFrom, current) {
  const path = [current];
  const key = (x, z) => `${x},${z}`;
  while (cameFrom.has(key(current.x, current.z))) {
    current = cameFrom.get(key(current.x, current.z));
    path.push(current);
  }
  return path.reverse();
}

let monsterPath = [];
let monsterPathIndex = 0;
let lastPathUpdate = 0;

function updateMonsterPathfinding() {
  const now = performance.now();
  if (now - lastPathUpdate > 1000) { // Recalculate path every second
    const monsterGrid = worldToGrid(monster.position);
    const playerGrid = worldToGrid(camera.position);
    monsterPath = findPathAStar(monsterGrid, playerGrid);
    monsterPathIndex = 0;
    lastPathUpdate = now;
  }

  if (monsterPath && monsterPath.length > 0 && monsterPathIndex < monsterPath.length) {
    const targetCell = monsterPath[monsterPathIndex];
    const targetPos = gridToWorld(targetCell.x, targetCell.z);

    const monsterSpeed = 1.5;
    const delta = clock.getDelta();

    const dir = new THREE.Vector3(
      targetPos.x - monster.position.x,
      0,
      targetPos.z - monster.position.z
    );

    const dist = dir.length();
    dir.normalize();

    if (dist > 0.1) {
      monster.position.x += dir.x * monsterSpeed * delta;
      monster.position.z += dir.z * monsterSpeed * delta;
    } else {
      monsterPathIndex++;
    }

    monster.lookAt(targetPos.x, monster.position.y, targetPos.z); // face player
    monster.userData.box.setFromObject(monster);
  }
}

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const elapsed = now - loadingStartTime;

  if (elapsed < loadingDuration) {
    const progress = Math.min(elapsed / loadingDuration, 1);
    loadingBar.style.width = `${progress * 100}%`;
    return; // Stop animation until loading done
  } else if (loadingScreen.style.display !== 'none') {
    loadingScreen.style.display = 'none';
  }


  const dt = clock.getDelta();
  const speed = 3;

  manageChunks();

  updateMonsterPathfinding();

  const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const right = new THREE.Vector3(Math.sin(yaw - Math.PI / 2), 0, Math.cos(yaw - Math.PI / 2));
  const move = new THREE.Vector3();

  if (firstFrame)
  {
    findSafeStartPosition(); // Ensures you're not inside a wall
    firstFrame = false;
  }

  if (moveFlags.up) move.add(forward);
  if (moveFlags.down) move.sub(forward);
  if (moveFlags.left) move.sub(right);
  if (moveFlags.right) move.add(right);

if (move.length() > 0) {
    move.normalize().multiplyScalar(speed * dt);
    const newPos = camera.position.clone().add(move);
    if (!checkCollision(newPos)) {
      camera.position.copy(newPos);
    } else {
      const tryX = camera.position.clone();
      tryX.x += move.x;
      if (!checkCollision(tryX)) camera.position.x = tryX.x;
      const tryZ = camera.position.clone();
      tryZ.z += move.z;
      if (!checkCollision(tryZ)) camera.position.z = tryZ.z;
    }

    // Increase walk time when moving
    walkTime += dt;

} else {
    // Reset or dampen walk time when standing still
    walkTime = Math.max(0, walkTime - dt * 0);
}

const bobAmplitude = 0.08;     // Up/down amount
const swayAmplitude = 0.05;    // Left/right amount
const bobSpeed = 8;            // How fast the bobbing happens

if (walkTime > 0) {
  const bobOffset = Math.sin(walkTime * bobSpeed) * bobAmplitude;
  const swayOffset = Math.sin(walkTime * bobSpeed * 0.5) * swayAmplitude;

  camera.position.y = 1.6 + bobOffset;
  camera.rotation.z = swayOffset * 0.3; // small tilt
} else {
  camera.position.y = 1.6;
  camera.rotation.z = 0;
}

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const pos = camera.position;
  document.getElementById('positionDisplay').textContent = 
  `x: ${pos.x.toFixed(2)}, y: ${pos.y.toFixed(2)}, z: ${pos.z.toFixed(2)}`;

  let mpos = monster.position;
  document.getElementById('positionDisplayMonster').textContent = 
  `x: ${mpos.x.toFixed(2)}, y: ${mpos.y.toFixed(2)}, z: ${mpos.z.toFixed(2)}`;

  renderer.render(scene, camera);
}

function createStartRoom() {
  const key = "start-room";
  const size = 8;
  const height = WALL_HEIGHT;
  const y = height / 2;

  // Position relative to camera at (0, 0)
  const positions = [
    // Back wall
    { x: 0, z: -size / 2, length: size, vertical: false },
    // Left wall
    { x: -size / 2, z: 0, length: size, vertical: true },
    // Right wall
    { x: size / 2, z: 0, length: size, vertical: true },
    // Front wall (except center section is removed for exit)
    // We'll make two small segments for the front wall to create a gap
    { x: -size / 4 - 1, z: size / 2, length: size / 2 - 2, vertical: false },
    { x: size / 4 + 1, z: size / 2, length: size / 2 - 2, vertical: false }
  ];

  positions.forEach(p => {
    createWall(p.x, p.z, p.length, height, p.vertical, key);
  });
}

animate();
</script>

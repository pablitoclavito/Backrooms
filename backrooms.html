<!DOCTYPE html>
<html>
<body>
<!--something-->
<div id="defeatedScreen" style="
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.85);
  color: white;
  font-size: 48px;
  font-family: sans-serif;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 20;
">
  <div>You were caught.</div>
  <button id="restartBtn" style="margin-top: 20px; font-size: 24px;">Restart</button>
</div>

  <div id="instructions" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; color: white; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.75); font-family: sans-serif; font-size: 24px; z-index: 10; cursor: pointer;">
  Click to start
</div>

  <div id="positionDisplay" style="
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 6px 10px;
  background: rgba(0,0,0,0.5);
  color: #fff;
  font-family: monospace;
  font-size: 14px;
  z-index: 100;
"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>

  let defeated = false;

  let monster;

  let firstFrame = true;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x333300, 0.045);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 1.6, 0.543);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x403010, 0.25));

// Flashlight
const flashlight = new THREE.SpotLight(0xfffadd, 1.5, 20, Math.PI / 8, 0.4, 1.2);
flashlight.position.set(0, 0, 0);
flashlight.target.position.set(0, 0, -1);
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

const loader = new THREE.TextureLoader();
const wallTex = loader.load('backrooms_wallpaper.jpg');
wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
wallTex.repeat.set(20, 2);

const floorTex = loader.load('moist_carpet.webp');
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(100, 100);

const ceilTex = createCeilingTexture();
ceilTex.repeat.set(175, 175);

// Materials
const wallMat = new THREE.MeshLambertMaterial({ map: wallTex });
const floorMat = new THREE.MeshLambertMaterial({ map: floorTex });
const ceilMat = new THREE.MeshLambertMaterial({ map: ceilTex });

// Floor & Ceiling
const BIG = 1000;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(BIG, BIG), floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(BIG, BIG), ceilMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = 3;
scene.add(ceiling);

// Maze Management
const CHUNK_SIZE = 40;
const WALL_HEIGHT = 3;
const FADE_DURATION = 1; // seconds
const UNLOAD_DISTANCE = 90; // distance threshold for wall unload

const activeChunks = new Map();

createStartRoom();

function createWall(x, z, length, height, isVertical, chunkKey) {
  const thickness = 0.3;
  let width = isVertical ? thickness : length;
  let depth = isVertical ? length : thickness;

  const geo = new THREE.BoxGeometry(width, height, depth);
  const tex = wallTex.clone();
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(length / 2, height / 2);

  const mat = new THREE.MeshLambertMaterial({
    map: tex,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, height / 2, z);
  mesh.userData = {
    createdAt: performance.now() / 1000,
    fadingOut: false,
    chunkKey
  };

  // Create bounding box for collision
  mesh.userData.box = new THREE.Box3().setFromObject(mesh);

  scene.add(mesh);
  if (!activeChunks.has(chunkKey)) activeChunks.set(chunkKey, []);
  activeChunks.get(chunkKey).push(mesh);
}

function generateChunk(cx, cz) {
  const key = `${cx},${cz}`;
  if (key === "start-room") return; // Avoid overwriting the start room
  if (activeChunks.has(key)) return;

  const centerX = cx * CHUNK_SIZE;
  const centerZ = cz * CHUNK_SIZE;
  const step = CHUNK_SIZE / 8;

    for (let dx = -CHUNK_SIZE / 2; dx <= CHUNK_SIZE / 2; dx += step) {
      for (let dz = -CHUNK_SIZE / 2; dz <= CHUNK_SIZE / 2; dz += step) {
        if (Math.random() < 0.95) {
          const length = step;
          const isVertical = Math.random() < 0.5;
          createWall(centerX + dx, centerZ + dz, length, WALL_HEIGHT, isVertical, key);
        }
      }
    }
}

function manageChunks() {
  const cx = Math.floor(camera.position.x / CHUNK_SIZE);
  const cz = Math.floor(camera.position.z / CHUNK_SIZE);

  for (let dx = -1; dx <= 1; dx++) {
  for (let dz = -1; dz <= 1; dz++) {
    generateChunk(cx + dx, cz + dz);
  }
}

  const now = performance.now() / 1000;
  for (const [key, meshes] of activeChunks) {
    const [chunkX, chunkZ] = key.split(',').map(Number);
    const dx = chunkX * CHUNK_SIZE - camera.position.x;
    const dz = chunkZ * CHUNK_SIZE - camera.position.z;
    const distSq = dx * dx + dz * dz;

    if (distSq > UNLOAD_DISTANCE * UNLOAD_DISTANCE) {
      for (const mesh of meshes) {
        if (!mesh.userData.fadingOut) {
          mesh.userData.fadingOut = true;
          mesh.userData.fadeStart = now;
        }
      }
    } else {
      for (const mesh of meshes) {
        if (mesh.userData.fadingOut) {
          mesh.userData.fadingOut = false;
          mesh.userData.createdAt = now;
        }
      }
    }
  }

  for (const [key, meshes] of activeChunks) {
    for (let i = meshes.length - 1; i >= 0; i--) {
      const mesh = meshes[i];
      const t = now - (mesh.userData.fadingOut ? mesh.userData.fadeStart : mesh.userData.createdAt);
      const alpha = mesh.userData.fadingOut
        ? 1 - Math.min(t / FADE_DURATION, 1)
        : Math.min(t / FADE_DURATION, 1);

      mesh.material.opacity = alpha;

      if (mesh.userData.fadingOut && alpha <= 0) {
        scene.remove(mesh);
        meshes.splice(i, 1);
      } else {
        // Update bounding box if still visible
        mesh.userData.box.setFromObject(mesh);
      }
    }

    if (meshes.length === 0) activeChunks.delete(key);
  }
}

// Collision detection: checks if camera collides with any fully visible wall
function checkCollision(pos) {
  const r = 0.3; // collision radius
  // Approximate camera bounding box (around feet level)
  const box = new THREE.Box3(
    new THREE.Vector3(pos.x - r, pos.y - 1.6, pos.z - r),
    new THREE.Vector3(pos.x + r, pos.y - 1.0, pos.z + r)
  );

  for (const meshes of activeChunks.values()) {
    for (const mesh of meshes) {
      if (!mesh.userData.fadingOut && mesh.userData.box.intersectsBox(box)) {
        return true;
      }
    }
  }
  return false;
}

createMonster();

// Movement and controls
let yaw = 0, pitch = 0, mouseDown = false;
const sensitivity = 0.003;
const pitchLimit = Math.PI / 2 * 0.9;
const moveFlags = { up: false, down: false, left: false, right: false };

window.addEventListener('keydown', e => {
  if (['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyW') moveFlags.down = true;
  if (e.code === 'KeyS') moveFlags.up = true;
  if (e.code === 'KeyA') moveFlags.right = true;
  if (e.code === 'KeyD') moveFlags.left = true;
});
window.addEventListener('keyup', e => {
  if (e.code === 'KeyW') moveFlags.down = false;
  if (e.code === 'KeyS') moveFlags.up = false;
  if (e.code === 'KeyA') moveFlags.right = false;
  if (e.code === 'KeyD') moveFlags.left = false;
});
// window.addEventListener('mousedown', () => mouseDown = true);
// window.addEventListener('mouseup', () => mouseDown = false);
// window.addEventListener('mousemove', e => {
//   if (!mouseDown) return;
//   yaw -= e.movementX * sensitivity;
//   pitch -= e.movementY * sensitivity;
//   pitch = Math.min(Math.max(pitch, -pitchLimit), pitchLimit);
// });

function createCeilingTexture() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#fefae0';
  ctx.fillRect(0, 0, size, size);

  for (let i = 0; i < 3000; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const alpha = Math.random() * 0.2;
    const gray = 200 + Math.random() * 55;
    ctx.fillStyle = `rgba(${gray}, ${gray}, ${gray}, ${alpha})`;
    ctx.fillRect(x, y, 1, 1);
  }

  ctx.strokeStyle = '#aaa';
  ctx.lineWidth = 2;
  const tileSize = size / 4;
  for (let i = 0; i <= size; i += tileSize) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(10, 10);
  return texture;
}

const ambientAudio = new Audio('back-rooms-ambience-made-with-Voicemod.mp3'); // Put your ambient sound file here
ambientAudio.loop = true;
ambientAudio.volume = 1;
ambientAudio.play().catch(e => {
  console.log('Ambient audio playback blocked, will play on user interaction.', e);
  window.addEventListener('mousedown', () => ambientAudio.play());
});

const clock = new THREE.Clock();

function findSafeStartPosition() {
  const baseY = 1.6;
  const maxAttempts = 100;
  const radius = 4.0; // how far from the original position to search

  for (let i = 0; i < maxAttempts; i++) {
    const x = (Math.random() * 2 - 1) * radius;
    const z = (Math.random() * 2 - 1) * radius;
    const testPos = new THREE.Vector3(x, baseY, z);

    if (!checkCollision(testPos)) {
      camera.position.copy(testPos);
      console.log(`Found safe start at (${x.toFixed(2)}, ${z.toFixed(2)})`);
      return;
    }
  }

  console.warn("Could not find a safe starting position after 100 attempts.");
}

const instructions = document.getElementById('instructions');

instructions.addEventListener('click', () => {
  renderer.domElement.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === renderer.domElement) {
    instructions.style.display = 'none';
    document.addEventListener('mousemove', onMouseMove, false);
  } else {
    instructions.style.display = '';
    document.removeEventListener('mousemove', onMouseMove, false);
  }
});

function onMouseMove(e) {
  yaw -= e.movementX * sensitivity;
  pitch -= e.movementY * sensitivity;
  pitch = Math.min(Math.max(pitch, -pitchLimit), pitchLimit);
}

function createMonster() {
  const geo = new THREE.SphereGeometry(0.8, 16, 16); // or BoxGeometry for a blocky monster
  const mat = new THREE.MeshLambertMaterial({ color: 0x000000 });
  monster = new THREE.Mesh(geo, mat);

  monster.position.y = 0.8; // Adjust for monster height
  setMonsterRandomStart();
  scene.add(monster);
}

function showDefeatedScreen() {
  defeated = true;
  ambientAudio.pause(); // Optional: stop sound
  document.exitPointerLock?.(); // Exit mouse lock if active
  document.getElementById('defeatedScreen').style.display = 'flex';
}

document.getElementById('restartBtn').addEventListener('click', () => {
  location.reload(); // Full page reload to reset everything
});

function setMonsterRandomStart() {
  const range = 30;
  let x, z, pos;

  do {
    x = (Math.random() * 2 - 1) * range;
    z = (Math.random() * 2 - 1) * range;
    pos = new THREE.Vector3(x, monster.position.y, z);
  } while (pos.distanceTo(camera.position) < 8 || checkCollision(pos));

  monster.position.set(x, monster.position.y, z);
}

function maybeTeleportMonsterToPlayer() {
  const maxDistance = 60; // too far = teleport
  const minDistance = 10;
  const desiredDistance = 20 + Math.random() * 10;
  const maxAttempts = 50;

  const distance = monster.position.distanceTo(camera.position);
  if (distance < maxDistance) return; // don't teleport

  for (let i = 0; i < maxAttempts; i++) {
    const angle = Math.random() * Math.PI * 2;
    const x = camera.position.x + Math.cos(angle) * desiredDistance;
    const z = camera.position.z + Math.sin(angle) * desiredDistance;
    const testPos = new THREE.Vector3(x, monster.position.y, z);

    if (
      testPos.distanceTo(camera.position) >= minDistance &&
      !checkCollision(testPos)
    ) {
      monster.position.copy(testPos);
      console.log("Monster teleported closer!");
      return;

      function maybeTeleportMonsterToPlayer() {
  if (!monster) return; // prevent errors if monster isn't created
  // ... rest of teleport code
}

    }
  }

  console.warn("Could not find valid teleport location for monster.");
}

if (!defeated) {
  maybeTeleportMonsterToPlayer();
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const speed = 3;

  manageChunks();

  const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const right = new THREE.Vector3(Math.sin(yaw - Math.PI / 2), 0, Math.cos(yaw - Math.PI / 2));
  const move = new THREE.Vector3();

  if (firstFrame)
  {
    findSafeStartPosition(); // Ensures you're not inside a wall
    firstFrame = false;
  }

  if (moveFlags.up) move.add(forward);
  if (moveFlags.down) move.sub(forward);
  if (moveFlags.left) move.sub(right);
  if (moveFlags.right) move.add(right);

  if (move.length() > 0) {
    move.normalize().multiplyScalar(speed * dt);
    const newPos = camera.position.clone().add(move);
    if (!checkCollision(newPos)) {
      camera.position.copy(newPos);
      console.log("new pos not ok");
    } else {
      // Try moving only on X or Z axis separately for sliding effect
      const tryX = camera.position.clone();
      tryX.x += move.x;
      if (!checkCollision(tryX)) {
        camera.position.x = tryX.x;
        console.log("x pos not ok");
      }
      const tryZ = camera.position.clone();
      tryZ.z += move.z;
      if (!checkCollision(tryZ)) {
        camera.position.z = tryZ.z;
        console.log("z pos not ok");
      }
    }
  }

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const pos = camera.position;
  document.getElementById('positionDisplay').textContent = 
  `x: ${pos.x.toFixed(2)}, y: ${pos.y.toFixed(2)}, z: ${pos.z.toFixed(2)}`;

  if (monster) {
  const direction = new THREE.Vector3().subVectors(camera.position, monster.position);
  direction.y = 0; // keep on ground plane
  const distance = direction.length();

  if (distance > 0.5) {
    direction.normalize();
    const moveSpeed = 1.5 * dt; // monster speed
    monster.position.addScaledVector(direction, moveSpeed);
  }

  // Collision check with player
  if (distance < 0.75) {
    showDefeatedScreen();
  }
}


  renderer.render(scene, camera);
}

function createStartRoom() {
  const key = "start-room";
  const size = 8;
  const height = WALL_HEIGHT;
  const y = height / 2;

  // Position relative to camera at (0, 0)
  const positions = [
    // Back wall
    { x: 0, z: -size / 2, length: size, vertical: false },
    // Left wall
    { x: -size / 2, z: 0, length: size, vertical: true },
    // Right wall
    { x: size / 2, z: 0, length: size, vertical: true },
    // Front wall (except center section is removed for exit)
    // We'll make two small segments for the front wall to create a gap
    { x: -size / 4 - 1, z: size / 2, length: size / 2 - 2, vertical: false },
    { x: size / 4 + 1, z: size / 2, length: size / 2 - 2, vertical: false }
  ];

  positions.forEach(p => {
    createWall(p.x, p.z, p.length, height, p.vertical, key);
  });
}

animate();
</script>
